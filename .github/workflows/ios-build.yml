name: ios-ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild \
            -project ProxyOne.xcodeproj \
            -scheme ProxyOne \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ProxyOne.app"
          test -d "$APP"
          test -d "$APP/PlugIns/ProxyOneTunnel.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "待续IP系统.ipa" Payload
          ls -lh "待续IP系统.ipa"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: |
            待续IP系统.ipa
            build.log
          if-no-files-found: ignore
