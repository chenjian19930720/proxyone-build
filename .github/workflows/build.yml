name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ProxyOne.xcodeproj \
            -scheme ProxyOne \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ProxyOne.app"
          test -d "$APP"
          test -d "$APP/PlugIns/ProxyOneTunnel.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ProxyOne-unsigned.ipa Payload
          rm -rf Payload
          ls -lh ProxyOne-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyOne-unsigned-ipa
          path: ProxyOne-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
