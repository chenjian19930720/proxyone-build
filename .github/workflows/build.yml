name: build-ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ProxyOne.xcodeproj \
            -scheme ProxyOne \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/ProxyOne.app"
          test -d "$APP"
          test -d "$APP/PlugIns/ProxyOneTunnel.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "待续IP系统.ipa" Payload
          rm -rf Payload
          ls -lh "待续IP系统.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyOne-unsigned-ipa
          path: 待续IP系统.ipa
          if-no-files-found: error
          retention-days: 30
