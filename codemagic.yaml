workflows:
  ios-unsigned:
    name: Build unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ProxyOne.xcodeproj"
        XCODE_SCHEME: "ProxyOne"
    scripts:
      - name: Show toolchain
        script: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build (unsigned)
        script: |
          set -e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package ipa
        script: |
          set -e
          APP="build/Build/Products/Release-iphoneos/ProxyOne.app"
          test -d "$APP"
          test -d "$APP/PlugIns/ProxyOneTunnel.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "daixu-ip.ipa" Payload
          ls -lh "daixu-ip.ipa"
    artifacts:
      - daixu-ip.ipa
      - build/Build/Products/Release-iphoneos/ProxyOne.app
